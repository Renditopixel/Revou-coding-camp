<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <div class="page-wrapper">

    <!-- ── GREETING / CLOCK CARD (full width) ── -->
    <div class="card clock-card">
      <div id="clock" class="clock"></div>
      <div id="date-display" class="date-display"></div>
      <div id="greeting" class="greeting"></div>

      <!-- Challenge: custom name -->
      <div class="name-row">
        <input
          type="text"
          id="name-input"
          class="input input--sm"
          placeholder="Your name (optional)"
          maxlength="30"
          aria-label="Your name"
        />
        <button id="name-save" class="btn btn--outline-sm">Save name</button>
      </div>

      <!-- Challenge: light/dark toggle -->
      <button id="theme-toggle" class="btn btn--icon theme-btn" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
    </div>

    <!-- ── MIDDLE ROW: Timer + Tasks ── -->
    <div class="middle-row">

      <!-- Focus Timer -->
      <div class="card timer-card">
        <h2 class="card-title">Focus Timer</h2>

        <!-- Challenge: change Pomodoro time -->
        <div class="pomodoro-row">
          <label for="pomodoro-minutes" class="small-label">Minutes:</label>
          <input
            type="number"
            id="pomodoro-minutes"
            class="input input--tiny"
            min="1"
            max="120"
            value="25"
            aria-label="Session duration"
          />
          <button id="pomodoro-set" class="btn btn--outline-sm">Set</button>
        </div>

        <div class="timer-display" aria-live="polite" aria-atomic="true">
          <span id="timer-minutes">25</span>:<span id="timer-seconds">00</span>
        </div>

        <div class="timer-buttons">
          <button id="timer-start" class="btn btn--timer">Start</button>
          <button id="timer-stop"  class="btn btn--timer">Stop</button>
          <button id="timer-reset" class="btn btn--timer">Reset</button>
        </div>

        <p id="timer-status" class="timer-status"></p>
      </div>

      <!-- Tasks -->
      <div class="card tasks-card">
        <h2 class="card-title">Tasks</h2>

        <div class="task-input-row">
          <input
            type="text"
            id="todo-input"
            class="input"
            placeholder="Add a new task..."
            maxlength="100"
            aria-label="New task"
          />
          <button id="todo-add" class="btn btn--add">Add</button>
        </div>

        <!-- Challenge: sort tasks -->
        <div class="sort-row">
          <label for="todo-sort" class="small-label">Sort:</label>
          <select id="todo-sort" class="select" aria-label="Sort tasks">
            <option value="default">Default</option>
            <option value="az">A → Z</option>
            <option value="za">Z → A</option>
            <option value="done">Done last</option>
            <option value="undone">Done first</option>
          </select>
        </div>

        <ul id="todo-list" class="todo-list" aria-label="Task list"></ul>
        <p id="todo-empty" class="empty-msg">No tasks yet.</p>
      </div>

    </div><!-- /.middle-row -->

    <!-- ── QUICK LINKS ── -->
    <div class="card links-card">
      <h2 class="card-title">Quick Links</h2>

      <div class="links-input-row">
        <input
          type="text"
          id="link-name"
          class="input"
          placeholder="Link name"
          maxlength="30"
          aria-label="Link label"
        />
        <input
          type="url"
          id="link-url"
          class="input"
          placeholder="URL"
          aria-label="Link URL"
        />
        <button id="link-add" class="btn btn--add">Add Link</button>
      </div>

      <div id="links-grid" class="links-grid" aria-label="Saved links"></div>
      <p id="links-empty" class="empty-msg" style="display:none">No links yet.</p>
    </div>

  </div><!-- /.page-wrapper -->

  <!-- Toast -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
